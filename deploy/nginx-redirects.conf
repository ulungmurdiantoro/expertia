# Pengalihan permanen ke satu alamat kanonik: https://expertia.id
#
# Saat ini http://expertia.id menjawab 404 dan https://www.expertia.id menampilkan
# salinan situs. Tambahkan dua blok server ini ke konfigurasi nginx (mis.
# /etc/nginx/sites-available/expertia.id), sesuaikan path sertifikat dengan yang
# sudah dipakai blok https utama, lalu:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pastikan juga sertifikat mencakup www.expertia.id (mis. certbot --nginx -d expertia.id -d www.expertia.id).

# 1. Semua permintaan http (dengan atau tanpa www) -> https://expertia.id
server {
    listen 80;
    listen [::]:80;
    server_name expertia.id www.expertia.id;

    return 301 https://expertia.id$request_uri;
}

# 2. https://www.expertia.id -> https://expertia.id
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.expertia.id;

    ssl_certificate     /etc/letsencrypt/live/expertia.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expertia.id/privkey.pem;

    return 301 https://expertia.id$request_uri;
}

# Catatan: aplikasi juga mengalihkan host www ke expertia.id (RedirectToCanonicalHost),
# jadi blok ke-2 hanya menghemat satu proses PHP per permintaan.
